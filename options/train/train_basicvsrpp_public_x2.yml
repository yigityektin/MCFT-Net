name: basicvsrpp_public_x2
model_type: VideoRecurrentModel
scale: 2
num_gpu: 1
manual_seed: 0

datasets:
  train:
    name: REDS_public_tuning
    type: REDSDataset
    dataroot_gt: ./basicvsr_data/train_gt
    dataroot_lq: ./basicvsr_data/train_lq
    dataroot_flow: ~
    meta_info_file: ./basicvsr_data/train/meta_info.txt
    val_partition: official
    io_backend:
      type: disk
    num_frame: 7
    gt_size: 128
    interval_list: [1]
    random_reverse: true
    use_hflip: true
    use_rot: true
    num_worker_per_gpu: 2
    batch_size_per_gpu: 1
    phase: train
    scale: 2

network_g:
  type: BasicVSRPlusPlus
  mid_channels: 64
  num_blocks: 7
  max_residue_magnitude: 10
  is_low_res_input: true
  spynet_path: ./checkpoints/spynet_basicvsrpp.pth
  cpu_cache_length: 100

path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
    betas: [0.9, 0.99]
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean
  total_iter: 5000
  warmup_iter: -1
  fix_flow_iter: 1000
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [5000]
    restart_weights: [1]
    eta_min: !!float 1e-7

logger:
  print_freq: 100
  save_checkpoint_freq: 1000
  use_tb_logger: false

dist_params:
  backend: nccl
